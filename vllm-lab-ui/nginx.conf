# The browser supplies the selected upstream in this header. The UI itself is
# loopback-only, so this proxy also avoids requiring CORS on the model server.
map $http_x_llm_endpoint $llm_endpoint {
  ""      https://llm-gateway.cosmos.cboxlab.com;
  default $http_x_llm_endpoint;
}

resolver 1.1.1.1 8.8.8.8 ipv6=off valid=30s;

server {
  listen 80;
  listen 127.0.0.1:3001;
  server_name localhost;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /v1/ {
    proxy_pass $llm_endpoint$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
  }

  location = /metrics {
    proxy_pass $llm_endpoint$request_uri;
    proxy_set_header Host $proxy_host;
    proxy_ssl_server_name on;
    proxy_buffering off;
  }

  location = /health {
    access_log off;
    add_header Content-Type text/plain;
    return 200 "ok\n";
  }
}
